name: Release
# Push a tag like v0.2.0 to build, publish a GitHub release, and update the cask.
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build universal app
        run: |
          VERSION="${GITHUB_REF_NAME#v}" UNIVERSAL=1 ./build.sh
          echo "SHA256=$(shasum -a 256 build/MenuBarManager.zip | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/MenuBarManager.zip --title "$GITHUB_REF_NAME" --generate-notes
      - name: Update cask on main
        run: |
          git fetch origin main && git checkout main
          sed -i '' -E "s/^  version \".*\"/  version \"$VERSION\"/" Casks/menubar-manager.rb
          sed -i '' -E "s/^  sha256 .*/  sha256 \"$SHA256\"/" Casks/menubar-manager.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "cask: v$VERSION" && git push origin main || echo "Cask unchanged"
